[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aiman-agent-router"
version = "0.1.0"
description = "AIMAN deterministic routing core for world models, agents, and execution fabrics"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "Proprietary"}
authors = [{name = "AIMAN"}]
dependencies = []

[project.scripts]
aiman-router = "aiman_agent_router.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
